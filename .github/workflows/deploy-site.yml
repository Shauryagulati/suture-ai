name: Deploy site

# Push-to-deploy for the marketing page at site/.
#
# This uses wrangler rather than Cloudflare's native Git integration because the
# "suture" Pages project was created as a direct-upload project, and Cloudflare
# does not allow converting one to Git-connected. Recreating it would mean
# releasing the suture.pages.dev name, so we drive the same deploy from CI.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - the account the Pages project lives in

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=suture --branch=main

      - name: Verify the deployment serves
        run: |
          set -euo pipefail
          # Pages needs a moment to propagate the new build to the alias.
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' https://suture.pages.dev)
          echo "suture.pages.dev -> HTTP $code"
          test "$code" = "200"
          for f in review inbox prior-auth analytics; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://suture.pages.dev/screenshots/$f.webp")
            echo "  $f.webp -> HTTP $code"
            test "$code" = "200"
          done
